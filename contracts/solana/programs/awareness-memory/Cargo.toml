[package]
name = "awareness-memory"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Solana-native private agent memory transition registry"

[lib]
crate-type = ["cdylib", "lib"]
name = "awareness_memory"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
svm-tests = []
anchor-debug = []

[dependencies]
anchor-lang = "=0.32.2"
solana-keccak-hasher = "=2.2.1"

[dev-dependencies]
anchor-lang-idl = { version = "=0.1.4", features = ["build"] }
litesvm = "=0.7.1"
solana-account = "=2.2.1"
solana-instruction = "=2.3.0"
solana-keypair = "=2.2.3"
solana-message = "=2.4.0"
solana-pubkey = "=2.4.0"
solana-signer = "=2.2.1"
solana-transaction = { version = "=2.2.3", features = ["bincode"] }
solana-transaction-error = "=2.2.1"
serde_json = "=1.0.145"
